
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sportspass | Your Fitness, Your Way</title>
  <meta name="description" content="Discover gyms and fitness experiences with Sportspass.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #fff9f7;
      color: #292323;
    }
    header {
      padding: 24px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 26px; font-weight: 800; color: #ed6473; }
    .hero {
      min-height: 75vh;
      padding: 100px 8%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, #fff0ed, #ffe1e0);
    }
    h1 { font-size: clamp(42px, 7vw, 76px); max-width: 750px; }
    .hero p {
      font-size: 19px;
      line-height: 1.7;
      margin: 24px 0;
      max-width: 540px;
      color: #655b59;
    }
    .button {
      display: inline-block;
      width: fit-content;
      padding: 15px 28px;
      background: #ed6473;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }
    footer { padding: 30px 8%; color: #776d6b; }
  </style>
</head>
<body>
  <header>
    <div class="logo">SPORTSPASS</div>
    <a class="button" href="mailto:hello@sportspass.pk">Contact Us</a>
  </header>

  <main>
    <section class="hero">
      <h1>Your Fitness.<br>Your admin.</h1>
      <p>
        Discover gyms, explore fitness experiences,
        and make every workout count with Sportspass.
      </p>
      <a class="button" href="mailto:hello@sportspass.pk">
        Get in Touch
      </a>
    </section>
  </main>

  <footer>
    © 2026 Sportspass. All rights reserved.
  </footer>
</body>
</html>
